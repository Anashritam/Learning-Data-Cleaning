[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "data_cleaner"
version = "0.1.0"
description = "A modular data cleaning and processing pipeline"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
]

[project.scripts]
clean-data = "data_cleaner.__main__:main"

# ADD THIS SECTION:
[tool.pytest.ini_options]
pythonpath = ["src"]